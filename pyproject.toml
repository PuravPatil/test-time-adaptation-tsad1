[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audit"
version = "0.1.0"
description = "Shared evaluation harness for test-time adaptation in time-series anomaly detection (M2N2 vs CANDI)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
